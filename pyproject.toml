[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aula-f87pro-cli"
version = "0.1.0"
authors = [
    { name = "Ahorts", email = "godswayahorts@gmail.com" },
]
description = "A CLI tool to control Aula F87 Pro keyboard RGB lighting."
readme = "README.md" 
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License", 
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Environment :: Console",
    "Topic :: Utilities",
]
dependencies = [
    "hidapi",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["f87pro*"]

[project.optional-dependencies]
watch = ["inotify"]  # For efficient file watching (recommended for --watch mode)

[project.scripts]
aula-f87pro = "f87pro.cli:main"

[project.urls]
"Homepage" = "https://github.com/Ahorts/aula-f87pro" 